AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SNTIMNT authentication BFF with Cognito, opaque sessions, PKCE, CSRF, and token revocation.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z0-9-]+$"
  AppOrigin:
    Type: String
    Description: HTTPS application origin routed through CloudFront, without a trailing slash.
    AllowedPattern: "^https://[^/]+$"
    ConstraintDescription: Use an HTTPS origin such as https://app.example.com with no path or trailing slash.
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
  SessionAbsoluteTtlSeconds:
    Type: Number
    Default: 28800
    MinValue: 900
  SessionIdleTtlSeconds:
    Type: Number
    Default: 1800
    MinValue: 300
  RecentAuthenticationMaxAgeSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 900

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 15
    MemorySize: 512
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        AUTH_TABLE_NAME: !Ref AuthTable
        AUTH_KMS_KEY_ID: !GetAtt AuthKey.Arn
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        COGNITO_DOMAIN: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
        COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}"
        APP_ORIGIN: !Ref AppOrigin
        AUTH_CALLBACK_URL: !Sub "${AppOrigin}/api/auth/callback"
        SESSION_ABSOLUTE_TTL_SECONDS: !Ref SessionAbsoluteTtlSeconds
        SESSION_IDLE_TTL_SECONDS: !Ref SessionIdleTtlSeconds
        RECENT_AUTHENTICATION_MAX_AGE_SECONDS: !Ref RecentAuthenticationMaxAgeSeconds
        OAUTH_TRANSACTION_TTL_SECONDS: "600"
        LOGIN_RATE_LIMIT_COUNT: "20"
        LOGIN_RATE_LIMIT_WINDOW_SECONDS: "300"
        COOKIE_SECURE: "true"

Resources:
  AuthApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handler.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt AuthTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource: !GetAtt AuthTable.Arn
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
              Resource: !GetAtt AuthKey.Arn
      Events:
        AuthRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Path: /api/auth/{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handler.ts
        Format: cjs
        OutExtension:
          - .js=.cjs
        Minify: true
        Sourcemap: false
        Target: es2022

  AuthTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt AuthKey.Arn
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AuthKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${EnvironmentName} SNTIMNT authentication-session encryption"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  AuthKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/sntimnt-${EnvironmentName}-auth"
      TargetKeyId: !Ref AuthKey

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "sntimnt-${EnvironmentName}"
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "sntimnt-${EnvironmentName}-bff"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub "${AppOrigin}/api/auth/callback"
      LogoutURLs:
        - !Sub "${AppOrigin}/login"
      SupportedIdentityProviders:
        - COGNITO
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 10

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix
      ManagedLoginVersion: 2

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn:
      - UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  InvestorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: investor
      Description: Standard authenticated investor access.
      Precedence: 30

  OperationsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: operations
      Description: Operations access. Server-side policies still apply per resource.
      Precedence: 20

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admin
      Description: Administrative access. MFA enforcement is completed in the next hardening stage.
      Precedence: 10

Outputs:
  AuthApiEndpoint:
    Value: !Sub "https://${AuthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  RequiredCloudFrontBehavior:
    Value: Route /api/* to the AuthApi regional origin without caching and forward all cookies, query strings, and required headers.
